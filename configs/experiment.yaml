run_id: "yield_residual_boosting_poc_001"

paths:
  base_dataset: "data/base_dataset.csv"
  candidate_features: "data/candidate_features.csv"
  base_feature_cols: "data/base_feature_cols.txt"
  output_dir: "outputs"

columns:
  id_col: "sample_id"
  target_col: "yield"
  split_col: "split"

defects:
  - defect_id: "defect_1"
    bad_group_path: "data/groups/defect_1_bad.csv"
    good_group_path: "data/groups/defect_1_good.csv"
  - defect_id: "defect_2"
    bad_group_path: "data/groups/defect_2_bad.csv"
    good_group_path: "data/groups/defect_2_good.csv"
  - defect_id: "defect_3"
    bad_group_path: "data/groups/defect_3_bad.csv"
    good_group_path: "data/groups/defect_3_good.csv"

baseline_model:
  iterations: 3000
  depth: 6
  learning_rate: 0.03
  loss_function: "RMSE"
  eval_metric: "RMSE"
  random_seed: 42
  early_stopping_rounds: 100
  verbose: 200

residual_model:
  iterations: 300
  depth: 3
  learning_rate: 0.05
  loss_function: "RMSE"
  eval_metric: "RMSE"
  random_seed: 42
  early_stopping_rounds: 30
  verbose: false
  thread_count: 1

feature_filter:
  max_missing_rate: 0.8
  min_unique_values: 2

boosting:
  n_rounds: 5
  select_per_round: 1
  main_metric: "bad_rmse_reduction_over_before"
  min_improvement: 0.0
  selection_mode: "top_k"
  selection_metric: "bad_rmse_reduction_over_before"
  selection_threshold:
  selection_direction: "auto"
  max_select_per_round:
  use_test_for_selection: false
  min_valid_bad_samples: 1
  overfit_guard_enabled: true
  overfit_guard_metric_scope: "bad"
  overfit_guard_min_valid_rmse_reduction: 0.0
  overfit_guard_max_valid_after_over_baseline: 1.0
  overfit_guard_max_valid_train_gap: 0.25
  overfit_guard_use_test: false
  overfit_guard_max_test_after_over_baseline: 1.05
  show_progress: true
  progress_every: 100

final_model:
  iterations: 3000
  depth: 6
  learning_rate: 0.03
  loss_function: "RMSE"
  eval_metric: "RMSE"
  random_seed: 42
  early_stopping_rounds: 100
  verbose: 200

shap:
  enabled: true
  max_samples: 5000
